<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background with soft yellow/cream -->
  <rect width="32" height="32" fill="#f5f0e8"/>
  
  <!-- Watercolor-inspired abstract shapes -->
  <!-- Rust/brown blob top left -->
  <ellipse cx="10" cy="8" rx="7" ry="6" fill="#8b4513" opacity="0.7"/>
  
  <!-- Orange/peach blob -->
  <ellipse cx="18" cy="12" rx="6" ry="5" fill="#d4805d" opacity="0.6"/>
  
  <!-- Green blob right side -->
  <ellipse cx="24" cy="10" rx="5" ry="7" fill="#6b7c5a" opacity="0.7"/>
  
  <!-- Yellow/lime center -->
  <ellipse cx="16" cy="16" rx="8" ry="8" fill="#c8c77d" opacity="0.5"/>
  
  <!-- Deep rust bottom -->
  <ellipse cx="12" cy="24" rx="6" ry="5" fill="#7d3c3c" opacity="0.7"/>
  
  <!-- Blue-grey top right -->
  <ellipse cx="26" cy="20" rx="5" ry="6" fill="#7a9199" opacity="0.6"/>
  
  <!-- Dark branch-like strokes -->
  <path d="M 16 2 Q 14 8 15 16 T 18 28" 
        stroke="#2d2d2d" 
        stroke-width="2" 
        fill="none" 
        opacity="0.8"/>
  
  <path d="M 10 6 Q 12 12 8 18" 
        stroke="#2d2d2d" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.7"/>
  
  <path d="M 22 8 Q 20 14 24 20" 
        stroke="#2d2d2d" 
        stroke-width="1.5" 
        fill="none" 
        opacity="0.7"/>
  
  <!-- Small accent dots -->
  <circle cx="8" cy="14" r="1.5" fill="#4a3b35" opacity="0.8"/>
  <circle cx="24" cy="26" r="1" fill="#4a3b35" opacity="0.8"/>
</svg>
